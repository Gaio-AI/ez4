name: Tree gate
description: Skip a suite for a tree that already passed it. See tree-gate.mjs.
inputs:
  command:
    description: record | check | source
    required: true
  sha:
    description: Commit to record the status on, or to look up.
    required: true
outputs:
  tested:
    description: "'true' when check found the tree already tested."
    value: ${{ steps.gate.outputs.tested }}
  source:
    description: release | hotfix | other (command source).
    value: ${{ steps.gate.outputs.source }}
  tree:
    description: The tree recorded (command record).
    value: ${{ steps.gate.outputs.tree }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/tree-gate.mjs" "${{ inputs.command }}" "${{ inputs.sha }}"
