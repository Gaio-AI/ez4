name: Back-merge
description: Merge a released main commit back into develop. See back-merge.mjs.
inputs:
  sha:
    description: The main commit to bring into develop (the release commit).
    required: true
  token:
    description: gaio-code-agent App installation token; its merge starts develop's release.yml.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/back-merge.mjs" "${{ inputs.sha }}"
