name: Setup
description: Node from .nvmrc, pnpm or npm from packageManager, cached install, optional CodeArtifact and Doppler.
inputs:
  install:
    description: "'false' sets up the toolchain without installing dependencies."
    default: 'true'
  codeartifact:
    description: "'true' logs npm in to the gaio CodeArtifact @ez4 namespace before installing."
    default: 'false'
  aws-access-key-id:
    default: ''
  aws-secret-access-key:
    default: ''
  aws-session-token:
    description: The session token of temporary credentials (an assumed role); empty for static keys.
    default: ''
  aws-region:
    default: ''
  doppler:
    description: "'true' installs the Doppler CLI."
    default: 'false'
outputs:
  package-manager:
    value: ${{ steps.pm.outputs.name }}
runs:
  using: composite
  steps:
    - id: pm
      shell: bash
      run: echo "name=$(jq -r '.packageManager // "npm" | split("@")[0]' package.json)" >> "$GITHUB_OUTPUT"
    - if: steps.pm.outputs.name == 'pnpm'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ steps.pm.outputs.name == 'pnpm' && 'pnpm' || '' }}
        package-manager-cache: false
    # pnpm reuses an installed node_modules. `npm ci` deletes it before installing, so npm caches only its
    # download cache, keyed without the versions a release bumps (npm-cache-key.mjs).
    - if: inputs.install == 'true' && steps.pm.outputs.name == 'pnpm'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}
    - id: npm-cache
      if: inputs.install == 'true' && steps.pm.outputs.name == 'npm'
      shell: bash
      run: |
        {
          echo "dir=$(npm config get cache)"
          echo "key=$(node "$GITHUB_ACTION_PATH/npm-cache-key.mjs" package-lock.json)"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.install == 'true' && steps.pm.outputs.name == 'npm'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: npm-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ steps.npm-cache.outputs.key }}
        restore-keys: npm-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-
    - if: inputs.install == 'true' && inputs.codeartifact == 'true'
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ inputs.aws-session-token }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        [ -n "$AWS_SESSION_TOKEN" ] || unset AWS_SESSION_TOKEN
        aws codeartifact login --tool npm --domain gaio --repository npm --namespace ez4
    - if: inputs.install == 'true'
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.pm.outputs.name }}
      run: |
        if [ "$PACKAGE_MANAGER" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci --prefer-offline --no-audit --no-fund; fi
    - if: inputs.doppler == 'true'
      uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1
