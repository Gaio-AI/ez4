name: Tree gate
description: Skip a suite for a tree that already passed it. See tree-gate.mjs.
inputs:
  command:
    description: record | check | quick
    required: true
  sha:
    description: Commit to record the status on, or to look up.
    required: true
  state:
    description: "quick only: success | failure."
    default: ''
outputs:
  tested:
    description: "'true' when check found the tree already tested."
    value: ${{ steps.gate.outputs.tested }}
  tree:
    description: The tree recorded (command record).
    value: ${{ steps.gate.outputs.tree }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMAND: ${{ inputs.command }}
        SHA: ${{ inputs.sha }}
        STATE: ${{ inputs.state }}
      run: node "$GITHUB_ACTION_PATH/tree-gate.mjs" "$COMMAND" "$SHA"
