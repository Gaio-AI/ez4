name: PR checks
on:
  workflow_call:
    inputs:
      config: { type: string, default: .github/gaio-ci.json }
      sha: { type: string, default: '' }
      force: { type: boolean, default: false }
      # quick: the checks a pull request needs (the config's `quick` tasks and checks, plus lint), with no
      # services and no secrets in the commands. full: every leg, the suite a release ships on.
      mode: { type: string, default: quick }
      runs-on: { type: string, default: ubuntu-latest }
      timeout-minutes: { type: number, default: 60 }
      # An IAM role ARN assumed through GitHub OIDC for CodeArtifact and the suite's AWS commands. Set, its
      # credentials replace the aws-access-key-id / aws-secret-access-key secrets; aws-region stays required.
      aws-role: { type: string, default: '' }
    secrets:
      aws-access-key-id:
        required: false
      aws-secret-access-key:
        required: false
      aws-region:
        required: false
      doppler-token:
        required: false
permissions: {}
jobs:
  quick:
    if: inputs.mode == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read config
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        run: echo "codeartifact=$(jq -r '.codeartifact // false' "$CONFIG")" >> "$GITHUB_OUTPUT"
      - name: Plan legs
        id: plan
        uses: ./.github/gaio-actions/validated
        with:
          command: plan
          mode: quick
          config: ${{ inputs.config }}
          base: ${{ github.event.pull_request.base.sha || '' }}
          force: ${{ inputs.force }}
      - name: Assume the AWS role
        id: aws
        if: inputs.aws-role != '' && steps.plan.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.aws-region }}
          output-credentials: true
          output-env-credentials: false
      - name: ${{ fromJSON(steps.plan.outputs.names).setup }}
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/gaio-actions/setup
        with:
          codeartifact: ${{ steps.config.outputs.codeartifact }}
          aws-access-key-id: ${{ steps.aws.outputs.aws-access-key-id || secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws.outputs.aws-secret-access-key || secrets.aws-secret-access-key }}
          aws-session-token: ${{ steps.aws.outputs.aws-session-token }}
          aws-region: ${{ secrets.aws-region }}
      - name: ${{ fromJSON(steps.plan.outputs.names).changeset }}
        id: changeset
        if: github.event_name == 'pull_request' && steps.plan.outputs.skip != 'true'
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          CMD=$(jq -r .changeset "$CONFIG")
          bash -c "${CMD//\{base\}/$GITHUB_BASE_REF}"
      - name: Run quick legs
        id: legs
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/gaio-actions/suite
        with:
          config: ${{ inputs.config }}
          legs: ${{ steps.plan.outputs.legs }}
          checks: ${{ steps.plan.outputs.checks }}
          lint-hash: ${{ steps.plan.outputs.lint-needed == 'true' && steps.plan.outputs.lint-hash || '' }}
          names: ${{ steps.plan.outputs.names }}
      - name: Merge validated hashes
        if: ${{ !cancelled() && steps.plan.outputs.skip != 'true' }}
        uses: ./.github/gaio-actions/validated
        with:
          command: merge
          config: ${{ inputs.config }}
          legs: ${{ steps.plan.outputs.legs }}
          lint-hash: ${{ steps.plan.outputs.lint-needed == 'true' && steps.plan.outputs.lint-hash || '' }}
          check-hashes: ${{ steps.plan.outputs.check-hashes }}
      - name: Save validated cache
        if: ${{ !cancelled() && steps.plan.outputs.skip != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validated
          key: validated-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # A skipped legs step passes only when the plan skipped it; skipped after a failed setup or
      # changeset, it is a failure.
      - name: Report quick checks
        if: always()
        uses: ./.github/gaio-actions/tree-gate
        with:
          command: quick
          sha: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          state: ${{ steps.plan.outcome == 'success' && (steps.plan.outputs.skip == 'true' || steps.legs.outcome == 'success') && 'success' || 'failure' }}
  suite:
    if: inputs.mode == 'full'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      statuses: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read config
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          {
            echo "codeartifact=$(jq -r '.codeartifact // false' "$CONFIG")"
            echo "doppler=$(jq -r '.doppler // false' "$CONFIG")"
          } >> "$GITHUB_OUTPUT"
      - name: Plan legs
        id: plan
        uses: ./.github/gaio-actions/validated
        with:
          command: plan
          mode: full
          config: ${{ inputs.config }}
          force: ${{ inputs.force }}
      - name: Assume the AWS role
        id: aws
        if: inputs.aws-role != '' && steps.plan.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.aws-region }}
          output-credentials: true
          output-env-credentials: false
      - name: ${{ fromJSON(steps.plan.outputs.names).setup }}
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/gaio-actions/setup
        with:
          codeartifact: ${{ steps.config.outputs.codeartifact }}
          doppler: ${{ steps.config.outputs.doppler }}
          aws-access-key-id: ${{ steps.aws.outputs.aws-access-key-id || secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws.outputs.aws-secret-access-key || secrets.aws-secret-access-key }}
          aws-session-token: ${{ steps.aws.outputs.aws-session-token }}
          aws-region: ${{ secrets.aws-region }}
      - name: ${{ fromJSON(steps.plan.outputs.names).services }}
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.legs != '[]'
        uses: ./.github/gaio-actions/services
        with:
          config: ${{ inputs.config }}
      - name: ${{ fromJSON(steps.plan.outputs.names).env }}
        if: steps.plan.outputs.skip != 'true'
        env:
          CONFIG: ${{ inputs.config }}
        run: jq -r '.env // {} | to_entries[] | "\(.key)=\(.value)"' "$CONFIG" >> "$GITHUB_ENV"
      - name: Restore build outputs
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.build-cache != '' && !inputs.force
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.plan.outputs.build-cache }}
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            build-${{ runner.os }}-${{ runner.arch }}-main-
      - name: Run the suite
        id: legs
        if: steps.plan.outputs.skip != 'true'
        uses: ./.github/gaio-actions/suite
        with:
          config: ${{ inputs.config }}
          legs: ${{ steps.plan.outputs.legs }}
          checks: ${{ steps.plan.outputs.checks }}
          lint-hash: ${{ steps.plan.outputs.lint-needed == 'true' && steps.plan.outputs.lint-hash || '' }}
          names: ${{ steps.plan.outputs.names }}
          doppler-token: ${{ secrets.doppler-token }}
          aws-access-key-id: ${{ steps.aws.outputs.aws-access-key-id || secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws.outputs.aws-secret-access-key || secrets.aws-secret-access-key }}
          aws-session-token: ${{ steps.aws.outputs.aws-session-token }}
          aws-region: ${{ secrets.aws-region }}
      - name: Merge validated hashes
        if: ${{ !cancelled() && steps.plan.outputs.skip != 'true' }}
        uses: ./.github/gaio-actions/validated
        with:
          command: merge
          config: ${{ inputs.config }}
          legs: ${{ steps.plan.outputs.legs }}
          lint-hash: ${{ steps.plan.outputs.lint-needed == 'true' && steps.plan.outputs.lint-hash || '' }}
          check-hashes: ${{ steps.plan.outputs.check-hashes }}
      - name: Save validated cache
        if: ${{ !cancelled() && steps.plan.outputs.skip != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validated
          key: validated-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only a suite that ran green, or a plan with nothing to run, vouches for the tree: legs skipped
      # after a failed setup or service start must not record it.
      - name: Record tested tree
        if: steps.plan.outcome == 'success' && (steps.plan.outputs.skip == 'true' || steps.legs.outcome == 'success')
        uses: ./.github/gaio-actions/tree-gate
        with:
          command: record
          sha: ${{ inputs.sha || github.sha }}
      - name: Report quick checks
        if: steps.plan.outcome == 'success' && (steps.plan.outputs.skip == 'true' || steps.legs.outcome == 'success')
        uses: ./.github/gaio-actions/tree-gate
        with:
          command: quick
          sha: ${{ inputs.sha || github.sha }}
          state: success
