name: Release

# develop: rebuilds changeset-release/develop (develop + a merge of main + `changeset version`),
# keeps its PR into main and tests that tree; nothing publishes. main: merging that PR or a
# hotfix/* PR publishes the version it brings to CodeArtifact and tags v<version>. Every push here
# uses GITHUB_TOKEN, which starts no workflow, so the run that pushes a tree also tests it.
on:
  push:
    branches:
      - develop
      - main
  # On develop: rebuilds the release PR, e.g. after a hotfix reached main.
  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: '24'

jobs:
  release-branch:
    name: 🌿 Release branch
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer push to develop rebuilds the branch from scratch.
    concurrency:
      group: release-branch
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.publish.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into the release branch
        uses: ./.github/actions/changeset-release
        with:
          command: prepare
          argument: ${{ github.sha }}

      - id: pending
        uses: ./.github/actions/changeset-release
        with:
          command: pending

      - name: Set up Node.js
        if: steps.pending.outputs.pending == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.pending.outputs.pending == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Version
        id: version
        if: steps.pending.outputs.pending == 'true'
        run: |
          npm run version-packages
          echo "version=$(node -p "require('./foundation/utils/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push the release branch and its PR
        id: publish
        if: steps.pending.outputs.pending == 'true'
        uses: ./.github/actions/changeset-release
        with:
          command: publish
          argument: release v${{ steps.version.outputs.version }}

      - name: Close the release PR
        if: steps.pending.outputs.pending != 'true'
        uses: ./.github/actions/changeset-release
        with:
          command: close

  gate:
    name: 🔎 Tested tree
    needs: [release-branch]
    # On main release-branch is skipped; on develop a failed or superseded rebuild stops the run.
    if: >-
      !cancelled() &&
      (needs.release-branch.result == 'success' || needs.release-branch.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tested: ${{ steps.check.outputs.tested }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # develop: the release branch head when something is pending, else the pushed commit.
      - id: sha
        env:
          SHA: ${{ needs.release-branch.outputs.sha || github.sha }}
        run: |
          git fetch -q origin "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: check
        uses: ./.github/actions/tree-gate
        with:
          command: check
          sha: ${{ steps.sha.outputs.sha }}
      - id: source
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/tree-gate
        with:
          command: source
          sha: ${{ github.sha }}

  suite:
    name: 🧪 Suite
    needs: [gate]
    # On main release-branch is skipped, and a skip propagates to every later job unless its `if`
    # starts with a status check, so each job below names the result it depends on.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.tested != 'true' }}
    # A newer push to develop supersedes this suite; main's never is, nor a manual run.
    concurrency:
      group: suite-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
    uses: ./.github/workflows/pull-requests.yml
    permissions:
      contents: read
      statuses: write
    with:
      sha: ${{ needs.gate.outputs.sha }}
    secrets: inherit

  record:
    name: 📌 Record tree
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.tested == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: ./.github/actions/tree-gate
        with:
          command: record
          sha: ${{ needs.gate.outputs.sha }}

  release:
    name: 🦋 Release
    needs: [gate, suite]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.gate.outputs.source != 'other' &&
      (needs.suite.result == 'success' ||
       (needs.suite.result == 'skipped' && needs.gate.outputs.tested == 'true'))
    runs-on: ubuntu-latest
    # Never cancel: an interrupted publish leaves a version half out.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # The merged PR already carries the version: the release branch or the hotfix ran
      # `changeset version`. A version is published only from a commit that carries its tag.
      - name: Unreleased version
        id: unreleased
        run: |
          version=$(node -p "require('./foundation/utils/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with CodeArtifact
        if: steps.unreleased.outputs.publish == 'true'
        env:
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: aws codeartifact login --tool npm --domain gaio --repository npm --namespace ez4

      - name: Publish
        if: steps.unreleased.outputs.publish == 'true'
        run: npm run release

      - name: Tag
        if: steps.unreleased.outputs.publish == 'true'
        env:
          VERSION: v${{ steps.unreleased.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      # Separate from the tag so a re-run creates a Release a failed run left out.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.unreleased.outputs.version }}
        run: gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --generate-notes --verify-tag
