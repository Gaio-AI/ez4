name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gaio-release.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
      id-token: write
    with:
      aws-role: ${{ vars.AWS_CI_ROLE }}
      aws-deploy-role: ${{ vars.AWS_PUBLISH_ROLE }}
    secrets:
      aws-region: ${{ secrets.AWS_REGION }}
