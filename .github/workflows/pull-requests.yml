name: Pull requests

on:
  pull_request:
    types:
      - ready_for_review
      - synchronize
      - opened
  # release.yml calls this when a pushed tree was never tested; the caller's event is `push`.
  workflow_call:
    inputs:
      record-sha:
        description: Commit that gets the Tested tree status once lint and every test leg pass.
        type: string
        required: true

# A reusable workflow shares the caller's `github.workflow`, so the event is part of the group,
# and only pull request runs are cancelled by a newer push.
concurrency:
  group: pull-requests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  # main receives only the release PR from develop and hotfix/* PRs.
  branch-policy:
    name: 🚦 Branch policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Only develop or hotfix/* into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*) exit 0 ;;
            *) echo "::error::PRs into main come from develop (release) or hotfix/*; target develop instead"; exit 1 ;;
          esac

  changeset:
    name: 🦋 Changeset
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.head_ref != 'develop' &&
      !startsWith(github.head_ref, 'back-merge/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # A pull request that needs no release adds one with `npx changeset add --empty`.
      - name: Require a changeset
        run: npx --yes @changesets/cli@3.0.3 status --since=origin/${{ github.base_ref }}
      - name: Allow a major only with a breaking note
        run: npm run changeset:check

  # The release PR runs no suite: develop's head already passed it (its Tested tree status).
  release-pr:
    name: 🔎 Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: tested
        uses: ./.github/actions/tree-gate
        with:
          command: verify
          sha: ${{ github.event.pull_request.head.sha }}
      - name: develop passed and contains main
        env:
          TESTED: ${{ steps.tested.outputs.tested }}
        run: |
          [ "$TESTED" = true ] || { echo "::error::develop's head has no passing Tested tree status: wait for its release.yml run"; exit 1; }
          git merge-base --is-ancestor origin/main HEAD \
            || { echo "::error::main has commits develop lacks: merge the open back-merge PR first"; exit 1; }

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && github.event.pull_request.fork == false &&
       github.head_ref != 'develop' && !startsWith(github.head_ref, 'back-merge/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Lint codebase
        run: npm run lint

  test:
    name: 🧪 Test ${{ matrix.group }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && github.event.pull_request.fork == false &&
       github.head_ref != 'develop' && !startsWith(github.head_ref, 'back-merge/'))

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: foundation
            workspaces: >-
              -w @ez4/utils -w @ez4/state -w @ez4/reflection -w @ez4/logger -w @ez4/project -w @ez4/schema
              -w @ez4/validator -w @ez4/transform
          - group: contracts
            workspaces: >-
              -w @ez4/gateway -w @ez4/database -w @ez4/cache -w @ez4/scheduler -w @ez4/storage -w @ez4/distribution
              -w @ez4/queue -w @ez4/topic -w @ez4/factory -w @ez4/validation -w @ez4/email
          - group: libraries
            workspaces: -w @ez4/pgsql -w @ez4/pgclient -w @ez4/pgmigration
          - group: local providers
            workspaces: >-
              -w @ez4/local-common -w @ez4/local-gateway -w @ez4/local-database -w @ez4/local-cache
              -w @ez4/local-scheduler -w @ez4/local-storage -w @ez4/local-queue -w @ez4/local-topic
              -w @ez4/local-distribution
          - group: docs providers
            workspaces: -w @ez4/docs-gateway -w @ez4/docs-database -w @ez4/docs-topology

    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0
        ports:
          - 8000:8000

      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Link all binaries
        run: npm link -w @ez4/project --prefer-offline --no-audit

      - name: Test ${{ matrix.group }}
        run: npm test ${{ matrix.workspaces }}

  # Branch protection requires a check with this name, so it stands for every lint and test job.
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && github.event.pull_request.fork == false &&
       github.head_ref != 'develop' && !startsWith(github.head_ref, 'back-merge/')))

    steps:
      - name: Require every lint and test job
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success

  # A PR run checks out refs/pull/N/merge, so it records the merged tree on the PR head:
  # the squash of an up-to-date PR into develop then needs no rerun.
  record:
    name: 📌 Record tree
    runs-on: ubuntu-latest
    needs: [tests]
    if: needs.tests.result == 'success'
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tree-gate
        with:
          command: record
          sha: ${{ inputs.record-sha || github.event.pull_request.head.sha }}
