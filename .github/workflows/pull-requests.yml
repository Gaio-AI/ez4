name: Pull requests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - ready_for_review
      - synchronize
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  changeset:
    name: 🦋 Changeset
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.base_ref == 'main' &&
      github.head_ref != 'changeset-release/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A pull request that needs no release adds one with `npx changeset add --empty`.
      - name: Require a changeset
        run: npx --yes @changesets/cli@3.0.3 status --since=origin/main

      - name: Allow only patches
        run: npm run changeset:check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event.pull_request.draft == false && github.event.pull_request.fork == false)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Lint codebase
        run: npm run lint

  test:
    name: 🧪 Test ${{ matrix.group }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event.pull_request.draft == false && github.event.pull_request.fork == false)

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: foundation
            workspaces: >-
              @ez4/utils @ez4/state @ez4/reflection @ez4/logger @ez4/project @ez4/schema @ez4/validator
              @ez4/transform
          - group: contracts
            workspaces: >-
              @ez4/gateway @ez4/database @ez4/cache @ez4/scheduler @ez4/storage @ez4/distribution @ez4/queue
              @ez4/topic @ez4/factory @ez4/validation @ez4/email
          - group: libraries
            workspaces: '@ez4/pgsql @ez4/pgclient @ez4/pgmigration'
          - group: local providers
            workspaces: >-
              @ez4/local-common @ez4/local-gateway @ez4/local-database @ez4/local-cache @ez4/local-scheduler
              @ez4/local-storage @ez4/local-queue @ez4/local-topic
          - group: docs providers
            workspaces: '@ez4/docs-gateway @ez4/docs-database @ez4/docs-topology'

    env:
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0
        ports:
          - 8000:8000

      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Link all binaries
        run: npm link -w @ez4/project --prefer-offline --no-audit

      # Each package's `test` script builds it first; the step above already built everything, so
      # this runs the rest of that script: the type check and the specs.
      - name: Test ${{ matrix.group }}
        run: |
          for workspace in ${{ matrix.workspaces }}; do
            npm exec --workspace "$workspace" -c 'tsc -p tsconfig.test.json --noEmit && ez4 test'
          done

  # Branch protection requires a check with this name, so it stands for every lint and test job.
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event.pull_request.draft == false && github.event.pull_request.fork == false)) }}

    steps:
      - name: Require every lint and test job
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
