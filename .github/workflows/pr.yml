name: PR
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the validated manifest and run every task.
        type: boolean
        default: false
permissions: {}
concurrency:
  group: pr-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    if: github.event.pull_request.draft != true
    uses: Gaio-AI/gaio-actions/.github/workflows/pr.yml@v1
    permissions:
      contents: read
      statuses: write
    with:
      force: ${{ inputs.force == true }}
    secrets:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}
