name: Deploy app
on:
  workflow_call:
    inputs:
      config: { type: string, default: .github/gaio-ci.json }
      app: { type: string, required: true }
      dir: { type: string, required: true }
      sha: { type: string, required: true }
      demo: { type: boolean, default: true }
      # An IAM role ARN assumed through GitHub OIDC instead of the aws-access-key-id / aws-secret-access-key
      # secrets, in the `demo` and `production` environments alike. aws-region stays required.
      aws-role: { type: string, default: '' }
    secrets:
      aws-access-key-id:
        required: false
      aws-secret-access-key:
        required: false
      aws-region:
        required: false
      doppler-stg-token:
        required: false
      doppler-prd-token:
        required: false
permissions: {}
jobs:
  demo:
    if: inputs.demo
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: deploy-${{ inputs.app }}-stg
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Read deploy tools
        id: tools
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          echo "codeartifact=$(jq -r 'if has("deploy-codeartifact") then .["deploy-codeartifact"] else true end' "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "doppler=$(jq -r 'if has("deploy-doppler") then .["deploy-doppler"] else true end' "$CONFIG")" >> "$GITHUB_OUTPUT"
      # The session must outlast the deploy: credentials that expire mid-deploy leave ez4 state half written.
      - name: Assume the AWS role
        id: aws
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.aws-region }}
          role-duration-seconds: 10800
          output-credentials: true
          output-env-credentials: false
      - name: Set up
        uses: ./.github/gaio-actions/setup
        with:
          codeartifact: ${{ steps.tools.outputs.codeartifact }}
          doppler: ${{ steps.tools.outputs.doppler }}
          aws-access-key-id: ${{ steps.aws.outputs.aws-access-key-id || secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws.outputs.aws-secret-access-key || secrets.aws-secret-access-key }}
          aws-session-token: ${{ steps.aws.outputs.aws-session-token }}
          aws-region: ${{ secrets.aws-region }}
      - name: Deploy ${{ inputs.app }} to demo
        env:
          APP: ${{ inputs.app }}
          DIR: ${{ inputs.dir }}
          CONFIG: ${{ inputs.config }}
          STAGE: demo
          DOPPLER_TOKEN: ${{ secrets.doppler-stg-token }}
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id || secrets.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key || secrets.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ secrets.aws-region }}
        run: |
          [ -n "$AWS_SESSION_TOKEN" ] || unset AWS_SESSION_TOKEN
          cmd=$(jq -r --arg d "$DIR" --arg s "$STAGE" '([.apps[] | objects | select(.dir == $d)] | first) as $u | if $u and ($u | has($s)) then $u[$s] // "" else .deploy end' "$CONFIG")
          if [ -z "$cmd" ]; then echo "$STAGE is skipped for $DIR"; exit 0; fi
          cmd=${cmd//\{app\}/$APP}
          bash -c "${cmd//\{env\}/stg}"
  prd:
    needs: demo
    if: ${{ !cancelled() && (needs.demo.result == 'success' || needs.demo.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    # deploy-site-prd is shared with gaio-frontend's deploy-site.yml: one writer of the site's prd ez4 state at a time.
    concurrency:
      group: deploy-${{ inputs.app }}-prd
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Read deploy tools
        id: tools
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          echo "codeartifact=$(jq -r 'if has("deploy-codeartifact") then .["deploy-codeartifact"] else true end' "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "doppler=$(jq -r 'if has("deploy-doppler") then .["deploy-doppler"] else true end' "$CONFIG")" >> "$GITHUB_OUTPUT"
      # The session must outlast the deploy: credentials that expire mid-deploy leave ez4 state half written.
      - name: Assume the AWS role
        id: aws
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.aws-region }}
          role-duration-seconds: 10800
          output-credentials: true
          output-env-credentials: false
      - name: Set up
        uses: ./.github/gaio-actions/setup
        with:
          codeartifact: ${{ steps.tools.outputs.codeartifact }}
          doppler: ${{ steps.tools.outputs.doppler }}
          aws-access-key-id: ${{ steps.aws.outputs.aws-access-key-id || secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ steps.aws.outputs.aws-secret-access-key || secrets.aws-secret-access-key }}
          aws-session-token: ${{ steps.aws.outputs.aws-session-token }}
          aws-region: ${{ secrets.aws-region }}
      - name: Deploy ${{ inputs.app }} to prd
        env:
          APP: ${{ inputs.app }}
          DIR: ${{ inputs.dir }}
          CONFIG: ${{ inputs.config }}
          STAGE: prd
          DOPPLER_TOKEN: ${{ secrets.doppler-prd-token }}
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id || secrets.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key || secrets.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ secrets.aws-region }}
        run: |
          [ -n "$AWS_SESSION_TOKEN" ] || unset AWS_SESSION_TOKEN
          cmd=$(jq -r --arg d "$DIR" --arg s "$STAGE" '([.apps[] | objects | select(.dir == $d)] | first) as $u | if $u and ($u | has($s)) then $u[$s] // "" else .deploy end' "$CONFIG")
          if [ -z "$cmd" ]; then echo "$STAGE is skipped for $DIR"; exit 0; fi
          cmd=${cmd//\{app\}/$APP}
          bash -c "${cmd//\{env\}/prd}"
  tag:
    needs: prd
    if: ${{ !cancelled() && needs.prd.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Read tag template
        id: template
        env:
          DIR: ${{ inputs.dir }}
          CONFIG: ${{ inputs.config }}
        run: echo "tag-template=$(jq -r --arg d "$DIR" '([.apps[] | objects | select(.dir == $d) | .tag] | first) // "{package}@{version}"' "$CONFIG")" >> "$GITHUB_OUTPUT"
      - name: Tag ${{ inputs.app }}
        uses: ./.github/gaio-actions/release-tag
        with:
          app-dir: ${{ inputs.dir }}
          tag-template: ${{ steps.template.outputs.tag-template }}
